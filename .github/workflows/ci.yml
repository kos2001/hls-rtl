name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EDA tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends verilator yosys
      - name: Install Python deps (venv)
        # A venv is required: outside one, cocotb's Makefile exports PYTHONHOME
        # (for the embedded interpreter), which poisons the system python3 that
        # Verilator's build scripts invoke -> "No module named 'encodings'".
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r api/requirements.txt
      - name: Unit tests (golden model, stimulus, test set)
        run: .venv/bin/python -m pytest tests/ -q
      - name: 3-way RTL regression (cocotb + verilator)
        run: |
          source .venv/bin/activate
          make -C tb -s

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
